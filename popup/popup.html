<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>hh Fit Scorer</title>
  <style>
    * { box-sizing: border-box; }
    body {
      width: 300px; margin: 0; padding: 16px;
      font: 13px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      color: #1a1a1a; background: #fff;
    }
    h1 { font-size: 14px; margin: 0 0 12px; }
    .status { display: grid; gap: 7px; margin-bottom: 14px; }
    .line { display: flex; align-items: center; gap: 8px; }
    .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
    .dot.on { background: #129d5f; }
    .dot.off { background: #d64545; }
    .line .txt { flex: 1; }
    h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .4px;
      color: #8a929e; margin: 16px 0 7px; }
    table { width: 100%; border-collapse: collapse; }
    td { padding: 3px 0; font-size: 12.5px; }
    td.v { text-align: right; font-weight: 600; font-variant-numeric: tabular-nums; }
    .btns { display: grid; gap: 7px; margin-top: 16px; }
    button {
      font: inherit; font-size: 12.5px; padding: 8px 12px; border-radius: 7px;
      border: 1px solid #d5dae1; background: #fff; color: #39414d; cursor: pointer;
    }
    button:hover { background: #f7f9fb; }
    button.primary { background: #2965cc; border-color: #2965cc; color: #fff; }
    button.primary:hover { background: #2358b4; }
    .note { font-size: 11px; color: #9aa2ae; margin-top: 12px; }
  </style>
</head>
<body>
  <h1>hh Fit Scorer</h1>

  <div class="status">
    <div class="line"><span class="dot off" id="dotKey"></span><span class="txt">API key</span><span id="keyState">—</span></div>
    <div class="line"><span class="dot off" id="dotProfile"></span><span class="txt">Profile</span><span id="profileState">—</span></div>
  </div>

  <h2>Usage</h2>
  <table>
    <tr><td>Calls</td><td class="v" id="calls">0</td></tr>
    <tr><td>Input tokens</td><td class="v" id="tokens">0</td></tr>
    <tr><td>Estimated spend</td><td class="v" id="cost">$0.00</td></tr>
    <tr><td>Cached vacancies</td><td class="v" id="cached">0</td></tr>
  </table>

  <div class="btns">
    <button class="primary" id="openOptions">Settings &amp; profile</button>
    <button id="clearCache">Clear cache</button>
  </div>

  <p class="note">Scores only the vacancy pages you open yourself. No crawling, no auto-apply.</p>

  <script src="popup.js" type="module"></script>
</body>
</html>
